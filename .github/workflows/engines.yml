name: Engines

# Builds the engine pack Kumquat installs from Settings ▸ Engines (Scripts/engines/build.sh) whenever the
# scripts change, and publishes it as a release when an engines-N tag is pushed (docs/RELEASING.md).
on:
  push:
    branches: ["**"]
    tags: ["engines-*"]
    paths: ["Scripts/engines/**", ".github/workflows/engines.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engines-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.engine }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        engine: [ffmpeg, webp, jpeg-xl, potrace, pandoc, woff2, fonttools]
        runner: [macos-15, macos-15-intel]
        include:
          # Upstream ships these as universal builds: one archive serves both processors.
          - { engine: sevenzip, runner: macos-15 }
          - { engine: calibre, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: Scripts/engines/build.sh ${{ matrix.engine }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.engine }}-${{ matrix.runner }}
          path: dist/
          if-no-files-found: error
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/engines-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 Scripts/engines/publish.py "$TAG" dist
          # Releases are immutable once published, so the files go into a draft first. Never Latest: the
          # README's download link must keep pointing at the app.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Engines ${TAG#engines-}" \
            --notes-file dist/NOTES.md dist/*.tar.xz "dist/$TAG-sources.tar" dist/EnginePackManifest.swift
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          {
            echo '### Commit this as `Sources/KumquatCore/Support/EnginePackManifest.swift`'
            echo '```swift'
            cat dist/EnginePackManifest.swift
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
