name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      # FFmpeg and pandoc enable the media and markup tests; the rest run with Apple frameworks only.
      - name: Optional engines
        run: brew install ffmpeg pandoc
      - name: Test
        run: make test
