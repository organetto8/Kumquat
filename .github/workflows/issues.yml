name: Issue housekeeping

on:
  schedule:
    - cron: "30 6 * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  # Issues waiting on the reporter: stale after 14 quiet days, closed 7 days later.
  stale:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-labels: needs-info
          days-before-stale: 14
          days-before-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-issue-message: >
            This issue is waiting for more information and has had no reply for 14 days.
            It will close in 7 days unless someone comments.
          close-issue-message: >
            Closing for lack of the information needed to act on it. Comment with the details
            and it can be reopened.
          close-issue-reason: not_planned

  # The reporter answered: take the issue off the waiting list.
  answered:
    if: >
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.event.issue.user.login &&
      contains(github.event.issue.labels.*.name, 'needs-info')
    runs-on: ubuntu-latest
    steps:
      - run: gh issue edit "$NUMBER" --repo "$REPO" --remove-label needs-info --remove-label stale
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
